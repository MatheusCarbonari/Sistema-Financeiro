[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-financeiro"
version = "0.1.0"
description = "Aplicação local para controle financeiro pessoal."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.4",
]

[project.scripts]
bot-financeiro = "bot_financeiro.__main__:main"

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bot_financeiro = [
    "interface/static/*",
    "interface/templates/*.html",
]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
